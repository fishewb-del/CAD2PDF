name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    name: Docker image (incl. DWG support)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Building the image is the real test of the LibreDWG stage - it is
      # what a deploy host will do.
      - name: Build image
        run: docker build -t cad2pdf:ci .

      - name: dwg2dxf is present in the image
        run: docker run --rm cad2pdf:ci dwg2dxf --version

      - name: Start container
        run: |
          docker run -d --rm -p 8000:8000 --name cad2pdf cad2pdf:ci
          for i in $(seq 1 45); do
            curl -sf http://localhost:8000/healthz >/dev/null && exit 0
            sleep 2
          done
          echo "container never became healthy"; docker logs cad2pdf; exit 1

      - name: Converts a DXF end to end
        run: |
          code=$(curl -s -o out.json -w '%{http_code}' \
            -F file=@examples/sample-floor-plan.dxf \
            -F scale=1:50 -F paper=A3 \
            http://localhost:8000/api/convert)
          test "$code" = "200" || { echo "HTTP $code"; cat out.json; exit 1; }
          python3 - <<'PY'
          import base64, json
          d = json.load(open("out.json"))
          assert d["ok"], d
          pdf = base64.b64decode(d["pdf_b64"])
          assert pdf[:4] == b"%PDF", "not a PDF"
          info = d["info"]
          assert info["scale"] == "1:50", info
          print("OK:", info["scale"], info["paper"], info["orientation"],
                "| printed", info["plotted_mm"], "mm")
          PY

      - name: Deployment dashboard reports the build
        run: |
          curl -sf http://localhost:8000/api/status -o status.json
          python3 - <<'PY'
          import json
          d = json.load(open("status.json"))
          assert d["status"] == "ok", d
          # The image is the whole point of the DWG stage; if LibreDWG
          # silently dropped out of the build, say so here rather than
          # letting a deploy discover it.
          assert d["features"]["dwg"] is True, d["features"]
          assert d["features"]["password_protected"] is False, d["features"]
          assert d["limits"]["workers"] == 1, d["limits"]
          print("status OK:", d["versions"])
          PY
          curl -sf http://localhost:8000/status | grep -q "Deployment status"

      - name: Stop container
        if: always()
        run: docker stop cad2pdf || true

      - name: Password gate keeps strangers out and health checks in
        run: |
          docker run -d --rm -p 8001:8000 --name guarded \
            -e CAD2PDF_PASSWORD=ci-secret -e CAD2PDF_USERNAME=ci \
            cad2pdf:ci
          for i in $(seq 1 45); do
            curl -sf http://localhost:8001/healthz >/dev/null && break
            sleep 2
          done
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code http://localhost:8001/healthz)" = "200"
          test "$(code http://localhost:8001/)" = "401"
          test "$(code -u ci:wrong http://localhost:8001/)" = "401"
          test "$(code -u ci:ci-secret http://localhost:8001/)" = "200"
          docker stop guarded

  huggingface:
    name: Hugging Face Space image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This image clones the app from GitHub, so it verifies the exact
      # Dockerfile a Space will build from the deploy guide.
      - name: Build Space image
        env:
          # GITHUB_REF_NAME is "<pr number>/merge" on a pull_request event.
          # That ref is not a branch and cannot be cloned, so this job only
          # ever worked on push events. Use the PR's head branch instead,
          # and its repository, so pull requests from forks build too.
          SPACE_REPO: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
          SPACE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          docker build -f deploy/huggingface/Dockerfile \
            --build-arg REPO_URL="$SPACE_REPO" \
            --build-arg REPO_BRANCH="$SPACE_BRANCH" \
            -t cad2pdf:hf .

      - name: dwg2dxf is present
        run: docker run --rm cad2pdf:hf dwg2dxf --version

      - name: Start container on the Space port
        run: |
          docker run -d --rm -p 8000:8000 --name hf cad2pdf:hf
          for i in $(seq 1 45); do
            curl -sf http://localhost:8000/healthz >/dev/null && exit 0
            sleep 2
          done
          echo "container never became healthy"; docker logs hf; exit 1

      - name: Converts a drawing end to end
        run: |
          code=$(curl -s -o hf.json -w '%{http_code}' \
            -F file=@examples/sample-floor-plan.dxf \
            -F scale=1:50 -F paper=A3 \
            http://localhost:8000/api/convert)
          test "$code" = "200" || { echo "HTTP $code"; cat hf.json; exit 1; }
          python3 -c "
          import base64, json
          d = json.load(open('hf.json'))
          assert d['ok'], d
          assert base64.b64decode(d['pdf_b64'])[:4] == b'%PDF'
          print('Space image OK:', d['info']['scale'], d['info']['paper'])
          "

      - name: Stop container
        if: always()
        run: docker stop hf || true
