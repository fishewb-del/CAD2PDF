# Environment for the Cloud Run service. Edit a value here and re-run
# deploy/cloudrun.sh to apply it.
#
# A YAML file rather than a --set-env-vars list because one of these values
# has a space in it, and gcloud splits that list on commas and spaces.
#
# The sizing below assumes a 2 GiB instance handling one drawing at a time.
# That pairing is the whole point: Cloud Run's default is 80 concurrent
# requests per instance, and 80 conversions sharing 2 GiB would run the
# instance out of memory on the first busy afternoon. cloudrun.sh pins
# concurrency to 1 and lets Cloud Run start more instances instead.

# One gunicorn worker, because Cloud Run already sends only one request at a
# time. Two threads so a health check is never queued behind a conversion.
WEB_CONCURRENCY: "1"
WEB_THREADS: "2"

# Ordered ceilings, largest last. Cloud Run stops the request at 300s
# (--timeout in cloudrun.sh), gunicorn would kill the worker at 300s, and the
# app stops its own work at 240s - so the app is always the one that answers,
# and the answer is a readable message rather than an empty response.
CAD2PDF_CONVERT_TIMEOUT: "240"
CAD2PDF_PREVIEW_TIMEOUT: "90"
GUNICORN_TIMEOUT: "300"

# Set explicitly rather than read from the container's cgroup: Cloud Run
# runs under a sandbox that does not always report a limit, and a budget
# that silently reads as "unlimited" is not a budget. Roughly 2 GiB less
# the resident app and a working margin.
CAD2PDF_MEMORY_BUDGET_MB: "1500"

# 2 GiB has room for drawings the 512 MB free tiers had to refuse.
CAD2PDF_MAX_UPLOAD_MB: "32"

# A full vCPU here, against a tenth of one on a free instance. DWG to DXF
# took under a second for a 5.5 MB drawing; this is headroom, not a target.
CAD2PDF_DWG_TIMEOUT: "120"

CAD2PDF_DEFAULT_PAPER: "ARCH D"
