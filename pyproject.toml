[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cad2pdf"
version = "0.1.0"
description = "Convert CAD DXF drawings to accurately scaled, vector PDF files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ezdxf>=1.1",
    "matplotlib>=3.7",
]

[project.scripts]
cad2pdf = "cad2pdf.cli:main"

[tool.setuptools]
packages = ["cad2pdf"]
